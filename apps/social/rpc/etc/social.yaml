Name: social.rpc
ListenOn: 0.0.0.0:8080
Etcd:
  Hosts:
  - ${HOST_IP}:3379
  Key: social.rpc

Mysql:
  DataSource: root:paipai@tcp(${HOST_IP}:13306)/paipai?charset=utf8mb4

Cache:
  - Host: ${HOST_IP}:16379
    Type: node
    Pass: paipai

JwtAuth:
  AccessSecret: paipai
  AccessExpire: 864000

telemetry:
  batcher: jaeger
  endpoint: http://${HOST_IP}:14268/api/traces
  name: social.rpc