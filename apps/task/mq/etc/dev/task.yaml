Name: task.mq
ListenOn: 0.0.0.0:10091

MsgChatTransfer:
  Name: MsgChatTransfer
  Brokers:
    - ${HOST_IP}:9092
  Group: kafka
  Topic: msgChatTransfer
  Offset: first
  Consumers: 1

MsgReadTransfer:
  Name: MsgReadTransfer
  Brokers:
    - ${HOST_IP}:9092
  Group: kafka
  Topic: msgReadTransfer
  Offset: first
  Consumers: 1

MsgReadHandler:
  GroupMsgReadHandler: 1
  GroupMsgReadRecordDelayTime: 60
  GroupMsgReadRecordDelayCount: 2

Redisx:
  Host: redis:6379
  Type: node
  Pass: pai-pai

